databaseChangeLog:
  - changeSet:
      id: 003_create-movie-genres-table
      author: denis
      changes:
        - createTable:
            tableName: movie_genres
            columns:
              - column:
                  name: movie_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: genre_id
                  type: UUID
                  constraints:
                    nullable: false
        - addPrimaryKey:
            tableName: movie_genres
            columnNames: movie_id, genre_id
            constraintName: pk_movie_genres
        - addForeignKeyConstraint:
            baseTableName: movie_genres
            baseColumnNames: movie_id
            referencedTableName: movies
            referencedColumnNames: id
            constraintName: fk_movie_genres_on_movie
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: movie_genres
            baseColumnNames: genre_id
            referencedTableName: genres
            referencedColumnNames: id
            constraintName: fk_movie_genres_on_genre
      rollback:
        - dropTable:
            tableName: movie_genres