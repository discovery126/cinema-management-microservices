databaseChangeLog:
  - changeSet:
      id: 001_create-movies-table
      author: denis
      changes:
        - createTable:
            tableName: movies
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_movies
              - column:
                  name: title
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uq_movies_title
              - column:
                  name: duration_minutes
                  type: INTEGER
                  constraints:
                    nullable: false
      rollback:
        - dropTable:
            tableName: movies