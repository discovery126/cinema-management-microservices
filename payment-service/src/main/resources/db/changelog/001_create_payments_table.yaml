databaseChangeLog:
  - changeSet:
      id: 001_create_payments_table
      author: denis
      changes:
        - createTable:
            tableName: payments
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_payments
              - column:
                  name: booking_id
                  type: UUID
                  constraints:
                    unique: true
                    uniqueConstraintName: uq_payments_booking_id
                    nullable: false
              - column:
                  name: amount
                  type: DECIMAL(10,2)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(10)
                  constraints:
                    nullable: false
              - column:
                  name: processed_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

        - sql:
            sql: ALTER TABLE payments ADD CONSTRAINT chk_payments_status_valid CHECK (status IN ('SUCCESS', 'FAILED'))