databaseChangeLog:
  - changeSet:
      id: 002_create_roles_table
      author: denis
      changes:
        - createTable:
            tableName: roles
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_roles
              - column:
                  name: name
                  type: VARCHAR(20)
                  constraints:
                    unique: true
                    nullable: false

        - insert:
            tableName: roles
            columns:
              - column: { name: id, valueComputed: "gen_random_uuid()" }
              - column: { name: name, value: ADMIN }
        - insert:
            tableName: roles
            columns:
              - column: { name: id, valueComputed: "gen_random_uuid()" }
              - column: { name: name, value: BOOKING_SERVICE }

        - insert:
            tableName: roles
            columns:
              - column: { name: id, valueComputed: "gen_random_uuid()" }
              - column: { name: name, value: USER }
      rollback:
        - dropTable:
            tableName: roles